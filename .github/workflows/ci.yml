name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format
        run: stylua --check src plugin

      - name: Lint
        run: selene src plugin

      - name: Build framework model
        run: rojo build framework.project.json -o Ordnance.rbxm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bundle
        run: node tools/bundle.mjs --embed

      - name: Build plugin
        run: rojo build plugin.project.json -o OrdnancePlugin.rbxm

      # Fails when a config section or public API function has no docs.
      - name: Build docs
        run: node tools/docs.mjs
